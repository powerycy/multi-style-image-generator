<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>__TITLE__</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d0a;color:#eee4d4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.heading{position:fixed;left:26px;top:23px;pointer-events:none;text-shadow:0 2px 10px #000}.eyebrow{font-size:10px;letter-spacing:3px;color:#c7a775}.heading h1{font-size:23px;font-weight:500;margin:8px 0}.heading p{font-size:12px;margin:0;color:#d0c3b1}.controls{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:12px 18px;border:1px solid #d5b57c30;border-radius:18px;background:#18130cbe;backdrop-filter:blur(16px);user-select:none}.movement{display:flex;gap:5px}button{border:1px solid #e8cfa32c;border-radius:9px;background:#bfa07112;color:inherit;width:37px;height:36px;font-size:18px;touch-action:none;cursor:pointer}button:active,button.active{background:#ac874957}label{display:flex;gap:8px;align-items:center;font-size:11px;white-space:nowrap;color:#cdbfa9}input{width:82px;accent-color:#bc955e}.hint{position:fixed;right:24px;top:26px;color:#d0c1ad;font-size:11px;text-align:right;text-shadow:0 1px 8px #000;line-height:1.8;pointer-events:none}#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px}#limit{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;text-shadow:0 2px 8px #000}
@media(max-width:600px){.heading{left:18px;top:20px}.heading h1{font-size:21px}.hint{top:auto;bottom:154px;right:0;width:100%;text-align:center;font-size:10px}.controls{flex-wrap:wrap;justify-content:center;width:345px;gap:10px;padding:10px;bottom:25px;max-width:calc(100% - 20px)}button{width:31px;height:35px}.movement{gap:3px;width:100%;justify-content:center}label{gap:5px}input{width:52px}#limit{bottom:185px}.heading p{font-size:10px}}
</style></head><body>
<canvas id="view" aria-label="可拖动旋转的全景点云" tabindex="0"></canvas>
<div class="heading"><div class="eyebrow">360° · POINT CLOUD</div><h1>__TITLE__</h1><p>__SUBTITLE__</p></div>
<div class="hint">拖动画面，环顾四周 · 滚轮拉近<br>W A S D 移动 · Q / E 升降 · Shift 加速</div>
<div class="controls"><div class="movement" aria-label="按住移动"><button data-key="a" aria-label="向左移动">←</button><button data-key="w" aria-label="向前移动">↑</button><button data-key="s" aria-label="向后移动">↓</button><button data-key="d" aria-label="向右移动">→</button><button data-key="q" aria-label="下降">−</button><button data-key="e" aria-label="上升">＋</button></div><label>点大小<input id="size" aria-label="点大小" type="range" min="0.6" max="1.9" step="0.05" value="1.15"></label><label>速度<input id="speed" aria-label="移动速度" type="range" min="1" max="12" step="0.5" value="4"></label></div>
<div id="status">正在展开全景点云…</div><div id="limit">已到场景边缘，可转向继续探索</div>
<script>
'use strict';
const canvas=document.getElementById('view'),gl=canvas.getContext('webgl',{antialias:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('status').textContent='当前浏览器无法启用 3D 显示';throw Error('WebGL unavailable')}
const vertex=`precision highp float;
attribute vec3 aPos;attribute vec4 aColor;attribute float aSpacing;uniform vec3 camera,right,up,forward;uniform float aspect,focal,height,pointSize;varying vec3 color;
void main(){vec3 v=aPos-camera;float z=dot(v,forward);gl_Position=vec4(dot(v,right)*focal/aspect,dot(v,up)*focal,1.00005*z-.1000025,z);gl_PointSize=clamp(pointSize*aSpacing*height*.5*focal/max(z,.1),1.,30.);color=pow(aColor.rgb,vec3(.90));}`;
const fragment=`precision mediump float;varying vec3 color;void main(){float r=length(gl_PointCoord-.5);if(r>.5)discard;gl_FragColor=vec4(color,1.);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const bytes=Uint8Array.from(atob('__POINTS__'),c=>c.charCodeAt(0)),buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,bytes,gl.STATIC_DRAW);
for(const [name,n,type,norm,offset] of [['aPos',3,gl.FLOAT,false,0],['aColor',4,gl.UNSIGNED_BYTE,true,12],['aSpacing',1,gl.FLOAT,false,16]]){const a=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,n,type,norm,20,offset)}
const u={};for(const name of ['camera','right','up','forward','aspect','focal','height','pointSize'])u[name]=gl.getUniformLocation(program,name);
const config=__CONFIG__;const state={yaw:config.yaw,pitch:config.pitch,fov:75,position:[0,0,0],size:1.15,speed:config.speed},keys=new Set();let dirty=true,last=0,drag=null,saveAt=0;
try{const s=JSON.parse(localStorage.getItem(config.storageKey));if(s&&Number.isFinite(s.yaw)&&Number.isFinite(s.pitch)&&s.position?.length===3&&s.position.every(Number.isFinite)){Object.assign(state,s);state.fov=Math.max(38,Math.min(100,state.fov));state.size=Math.max(.6,Math.min(1.9,state.size));const r=Math.hypot(state.position[0],state.position[2]);if(r>config.movementRange){state.position[0]*=config.movementRange/r;state.position[2]*=config.movementRange/r}state.position[1]=Math.max(config.minHeight,Math.min(config.maxHeight,state.position[1]));state.speed=Number.isFinite(state.speed)?Math.max(1,Math.min(12,state.speed)):4}}catch{}
document.getElementById('size').value=state.size;document.getElementById('speed').value=state.speed;
function save(){try{localStorage.setItem(config.storageKey,JSON.stringify(state))}catch{}}
function basis(){const y=state.yaw,p=state.pitch,c=Math.cos(p),s=Math.sin(p),sy=Math.sin(y),cy=Math.cos(y);return {right:[cy,0,sy],up:[-sy*s,c,-cy*-s],forward:[sy*c,s,-cy*c]}}
function resize(){const scale=Math.min(devicePixelRatio,1.75);canvas.width=Math.round(innerWidth*scale);canvas.height=Math.round(innerHeight*scale);gl.viewport(0,0,canvas.width,canvas.height);dirty=true}addEventListener('resize',resize);resize();
gl.enable(gl.DEPTH_TEST);gl.clearColor(.035,.025,.015,1);
function draw(){const b=basis();gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);for(const name of ['right','up','forward'])gl.uniform3fv(u[name],b[name]);gl.uniform3fv(u.camera,state.position);gl.uniform1f(u.aspect,canvas.width/canvas.height);gl.uniform1f(u.focal,1/Math.tan(state.fov*Math.PI/360));gl.uniform1f(u.height,canvas.height);gl.uniform1f(u.pointSize,state.size);gl.drawArrays(gl.POINTS,0,__COUNT__);dirty=false}
function tick(t){const dt=Math.min((t-last)/1000,.05);last=t;if(keys.size){let x=(+keys.has('d'))-(+keys.has('a')),z=(+keys.has('w'))-(+keys.has('s')),y=(+keys.has('e'))-(+keys.has('q'));const n=Math.hypot(x,y,z)||1,speed=state.speed*(keys.has('shift')?3:1)*dt/n,sy=Math.sin(state.yaw),cy=Math.cos(state.yaw);state.position[0]+=(x*cy+z*sy)*speed;state.position[1]+=y*speed;state.position[2]+=(x*sy-z*cy)*speed;const r=Math.hypot(state.position[0],state.position[2]);document.getElementById('limit').style.opacity=r>config.movementRange?1:0;if(r>config.movementRange){state.position[0]*=config.movementRange/r;state.position[2]*=config.movementRange/r}state.position[1]=Math.max(config.minHeight,Math.min(config.maxHeight,state.position[1]));dirty=true;if(t-saveAt>250){save();saveAt=t}}if(dirty)draw();requestAnimationFrame(tick)}
canvas.addEventListener('pointerdown',e=>{canvas.focus();drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;state.yaw-=(e.clientX-drag.x)*.004;state.pitch+=(e.clientY-drag.y)*.004;drag.x=e.clientX;drag.y=e.clientY;dirty=true});
function release(){drag=null;save()}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
canvas.addEventListener('wheel',e=>{e.preventDefault();state.fov=Math.max(38,Math.min(100,state.fov+e.deltaY*.035));dirty=true;save()},{passive:false});
document.getElementById('size').addEventListener('input',e=>{state.size=+e.target.value;dirty=true;save()});
document.getElementById('speed').addEventListener('input',e=>{state.speed=+e.target.value;save()});
function clear(){keys.clear();drag=null;document.querySelectorAll('.active').forEach(b=>b.classList.remove('active'));save()}
addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;const k=e.key.toLowerCase();if(('wasdqe'.includes(k)&&k.length===1)||k==='shift'){e.preventDefault();keys.add(k)}});addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());save()});addEventListener('blur',clear);document.addEventListener('visibilitychange',()=>{if(document.hidden)clear()});
for(const b of document.querySelectorAll('[data-key]')){b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key);b.classList.add('active')});const stop=()=>{keys.delete(b.dataset.key);b.classList.remove('active');save()};b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop)}
window.__sceneDebug={getState:()=>({...state,position:[...state.position],pointCount:__COUNT__}),setView:(yaw,pitch=0)=>{state.yaw=yaw;state.pitch=pitch;dirty=true},setPosition:(p)=>{state.position=[...p];dirty=true},bounds:()=>({movement:config.movementRange,vertical:[config.minHeight,config.maxHeight]}),render:draw};
document.getElementById('status').remove();requestAnimationFrame(tick);
</script></body></html>
